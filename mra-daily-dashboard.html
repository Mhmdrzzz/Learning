<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRA — Daily Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f4;--bg2:#f4f1eb;--bg3:#ede8df;
  --ink:#1a1714;--ink2:#6b6560;--ink3:#b8b2aa;
  --border:#e4dfd5;
  --orange:#f97316;--orange-d:#ea6c0b;
  --orange-bg:#fff7ed;--orange-light:#fed7aa;
  --teal:#0d9488;--teal-bg:#f0fdfa;--teal-light:#99f6e4;
  --violet:#7c3aed;--violet-bg:#f5f3ff;--violet-light:#ddd6fe;
  --green:#16a34a;--green-bg:#f0fdf4;--green-light:#bbf7d0;
  --rose:#e11d48;--rose-bg:#fff1f2;--rose-light:#fecdd3;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-light:#fde68a;
  --r:14px;--r-sm:10px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding-bottom:2rem}

/* HEADER */
.hdr{background:white;border-bottom:1px solid var(--border);padding:1.25rem 1.25rem 1rem}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.hdr-greeting{font-family:'Fraunces',serif;font-size:22px;font-weight:300;line-height:1.2}
.hdr-greeting em{font-style:italic;color:var(--orange)}
.hdr-date{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:0.07em;text-transform:uppercase;margin-top:3px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#fb923c);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:15px;color:white;flex-shrink:0}

/* PROGRESS */
.prog-card{margin:1rem 1.25rem;background:white;border:1.5px solid var(--border);border-radius:var(--r);padding:1rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 12px rgba(0,0,0,0.04)}
.ring{position:relative;width:70px;height:70px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:7}
.ring-fill{fill:none;stroke-width:7;stroke-linecap:round;stroke:var(--orange);transition:stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:16px;font-weight:800;color:var(--ink)}
.ring-lbl{font-size:9px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.prog-info{flex:1}
.prog-title{font-size:15px;font-weight:700;margin-bottom:3px}
.prog-sub{font-size:12px;color:var(--ink2);line-height:1.4}
.prog-sub b{color:var(--orange)}

/* CELEBRATE */
.celebrate{display:none;margin:0 1.25rem 0;background:var(--green-bg);border:1.5px solid var(--green-light);border-radius:var(--r);padding:1rem;text-align:center}
.celebrate.show{display:block}
.cel-emoji{font-size:28px;margin-bottom:6px}
.cel-title{font-family:'Fraunces',serif;font-size:17px;color:var(--green)}
.cel-sub{font-size:12px;color:var(--ink2);margin-top:2px}

/* TABS */
.tabs-wrap{padding:1rem 1.25rem 0;overflow-x:auto}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;width:max-content}
.tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--ink2);transition:all 0.15s;white-space:nowrap}
.tab.active{background:var(--ink);color:white;border-color:var(--ink)}

/* SECTIONS */
.sec{display:none;padding:1rem 1.25rem;animation:fi 0.18s ease}
.sec.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.sec-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:8px;margin-top:4px}

/* TASK */
.task{background:white;border:1.5px solid var(--border);border-radius:var(--r);padding:.9rem 1rem;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.task::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.task.cat-learn::after{background:var(--orange)}
.task.cat-read::after{background:var(--teal)}
.task.cat-brand::after{background:var(--violet)}
.task.done{background:var(--bg2);border-color:var(--bg3)}
.task.done .task-title{text-decoration:line-through;color:var(--ink3)}
.task:not(.done):hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.07)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.18s;background:white}
.chk.on{background:var(--green);border-color:var(--green)}
.chk svg{opacity:0;transform:scale(0);transition:all 0.15s}
.chk.on svg{opacity:1;transform:scale(1)}
.task-body{flex:1}
.task-title{font-size:13px;font-weight:700;margin-bottom:3px}
.task-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3)}
.dur-tag{background:var(--bg2);border-radius:20px;padding:2px 7px;font-weight:600;color:var(--ink2)}

/* CARD */
.card{background:white;border:1.5px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:8px;transition:all 0.15s}
.card:hover{border-color:var(--orange-light);box-shadow:0 3px 12px rgba(249,115,22,0.07)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-icon{width:38px;height:38px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.ci-book{background:var(--orange-bg)}
.ci-course{background:var(--teal-bg)}
.ci-lang{background:var(--violet-bg)}
.ci-res{background:var(--amber-bg)}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:700;margin-bottom:2px;line-height:1.3}
.card-sub{font-size:11px;color:var(--ink3);margin-bottom:5px}
.badge{display:inline-flex;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em}
.b-reading{background:var(--teal-bg);color:var(--teal)}
.b-done,.b-completed{background:var(--green-bg);color:var(--green)}
.b-queued{background:var(--bg3);color:var(--ink3)}
.b-progress{background:var(--amber-bg);color:var(--amber)}
.b-active{background:var(--violet-bg);color:var(--violet)}
.prog-bar-wrap{margin-top:8px}
.prog-bar-row{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px}
.prog-bar-lbl{color:var(--ink3)}
.prog-bar-pct{font-weight:700;color:var(--orange)}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--orange),#fb923c);transition:width .5s}
.card-note{margin-top:8px;padding:7px 9px;background:var(--bg);border-radius:7px;font-size:11px;color:var(--ink2);line-height:1.4;border-left:2px solid var(--orange-light)}
.card-foot{display:flex;justify-content:flex-end;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.mini{font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:none;color:var(--ink2);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;transition:all .12s}
.mini:hover{background:var(--bg2);color:var(--ink)}
.mini.del:hover{border-color:var(--rose-light);color:var(--rose);background:var(--rose-bg)}
.mini.lnk{color:var(--teal);border-color:var(--teal-light)}

.add-btn{width:100%;padding:11px;border:1.5px dashed var(--border);border-radius:var(--r);background:none;color:var(--ink3);font-size:13px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all .15s;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.add-btn:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-bg)}

.empty{text-align:center;padding:2rem 1rem;color:var(--ink3)}

/* SETTINGS */
.set-block{background:white;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.set-sec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.08em;padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:13px;font-weight:600}
.set-desc{font-size:11px;color:var(--ink3);margin-top:1px}
.set-btn{padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;background:white;color:var(--ink2);transition:all .12s;white-space:nowrap}
.set-btn:hover{background:var(--bg2)}
.set-btn.p{background:var(--orange);color:white;border-color:var(--orange)}
.set-btn.p:hover{opacity:.88}
.set-btn.d{color:var(--rose);border-color:transparent}
.set-btn.d:hover{background:var(--rose-bg);border-color:var(--rose-light)}
.stats-g{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:.9rem 1rem}
.smin{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center}
.smin-l{font-size:11px;color:var(--ink3)}
.smin-v{font-size:17px;font-family:'Fraunces',serif}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,.55);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;animation:mu .22s cubic-bezier(.4,0,.2,1)}
@keyframes mu{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhandle{width:34px;height:4px;background:var(--bg3);border-radius:2px;margin:0 auto 1.2rem}
.mtitle{font-family:'Fraunces',serif;font-size:20px;font-weight:300;margin-bottom:1.2rem}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.07em}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;font-size:13px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);background:white}
.field textarea{min-height:68px;resize:vertical;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rw{display:flex;align-items:center;gap:9px}
.rw input[type=range]{flex:1;accent-color:var(--orange)}
.rv{font-size:13px;font-weight:700;min-width:30px;color:var(--orange)}
.mfoot{display:flex;gap:8px;margin-top:1.2rem}
.msave{flex:1;padding:12px;background:var(--orange);color:white;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer}
.msave:hover{background:var(--orange-d)}
.mcancel{padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;background:none;color:var(--ink2)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:9px 18px;border-radius:20px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;letter-spacing:0.03em}
.toast.show{opacity:1}
.file-input{display:none}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-greeting" id="greeting">Good morning, <em>MRA</em></div>
      <div class="hdr-date" id="hdr-date"></div>
    </div>
    <div class="avatar">MR</div>
  </div>
</div>

<div class="prog-card">
  <div class="ring">
    <svg width="70" height="70" viewBox="0 0 70 70">
      <circle class="ring-bg" cx="35" cy="35" r="28"/>
      <circle class="ring-fill" id="rfill" cx="35" cy="35" r="28" stroke-dasharray="175.9" stroke-dashoffset="175.9"/>
    </svg>
    <div class="ring-inner">
      <div class="ring-pct" id="rpct">0%</div>
      <div class="ring-lbl">Done</div>
    </div>
  </div>
  <div class="prog-info">
    <div class="prog-title" id="ptitle">Today's Plan</div>
    <div class="prog-sub" id="psub">Start your day, MRA.</div>
  </div>
</div>

<div style="padding:0 1.25rem">
  <div class="celebrate" id="cel">
    <div class="cel-emoji">🎉</div>
    <div class="cel-title">All done today!</div>
    <div class="cel-sub">Outstanding. See you tomorrow.</div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab active" onclick="sw('today')">Today</div>
    <div class="tab" onclick="sw('books')">Books</div>
    <div class="tab" onclick="sw('courses')">Courses</div>
    <div class="tab" onclick="sw('resources')">Resources</div>
    <div class="tab" onclick="sw('lang')">Language</div>
    <div class="tab" onclick="sw('settings')">Settings</div>
  </div>
</div>

<div id="today" class="sec active"></div>
<div id="books" class="sec"></div>
<div id="courses" class="sec"></div>
<div id="resources" class="sec"></div>
<div id="lang" class="sec"></div>
<div id="settings" class="sec"></div>

</div>

<div class="overlay" id="ov">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mtitle" id="mtitle"></div>
    <div id="mfields"></div>
    <div class="mfoot">
      <button class="mcancel" onclick="closeM()">Cancel</button>
      <button class="msave" onclick="saveM()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" class="file-input" id="fi" accept=".json" onchange="importD(event)">

<script>
const SD={
  books:[
    {id:'b1',title:'Ogilvy on Advertising',author:'David Ogilvy',lang:'English',status:'done',progress:100,note:'Classic — the foundation of advertising.'},
    {id:'b2',title:'This Is Marketing',author:'Seth Godin',lang:'Persian',status:'reading',progress:0,note:'Month 1 — Amookhte translation recommended.'},
    {id:'b3',title:'Purple Cow',author:'Seth Godin',lang:'Persian',status:'queued',progress:0,note:'Month 2 — standing out in a crowded market'},
    {id:'b4',title:'Positioning: The Battle for Your Mind',author:'Al Ries & Jack Trout',lang:'Persian',status:'queued',progress:0,note:'Month 2 — foundation of brand strategy'},
    {id:'b5',title:'Influence',author:'Robert Cialdini',lang:'Persian',status:'queued',progress:0,note:'Month 3 — consumer psychology'},
    {id:'b6',title:'Building a StoryBrand',author:'Donald Miller',lang:'Persian',status:'queued',progress:0,note:'Month 4 — brand narrative'},
    {id:'b7',title:'Contagious',author:'Jonah Berger',lang:'Persian',status:'queued',progress:0,note:'Month 5 — why things spread'},
    {id:'b8',title:'Good Strategy Bad Strategy',author:'Richard Rumelt',lang:'English',status:'queued',progress:0,note:'Month 6 — strategic thinking for CEOs'},
    {id:'b9',title:'Thinking, Fast and Slow',author:'Daniel Kahneman',lang:'Persian',status:'queued',progress:0,note:'Month 7 — decision & consumer psychology'},
    {id:'b10',title:'Creativity, Inc.',author:'Ed Catmull',lang:'Persian',status:'queued',progress:0,note:'Month 8 — creative culture from Pixar'},
    {id:'b11',title:'Obviously Awesome',author:'April Dunford',lang:'English',status:'queued',progress:0,note:'Month 9 — positioning'},
    {id:'b12',title:'The Advice Trap',author:'Michael Bungay Stanier',lang:'English',status:'queued',progress:0,note:'Month 10 — be an advisor, not an executor'},
    {id:'b13',title:'Predictably Irrational',author:'Dan Ariely',lang:'Persian',status:'queued',progress:0,note:'Month 11 — irrational consumer behavior'},
    {id:'b14',title:'Building a Second Brain',author:'Tiago Forte',lang:'English',status:'queued',progress:0,note:'Month 12 — knowledge management'},
    {id:'b15',title:'Meditations',author:'Marcus Aurelius',lang:'Persian',status:'queued',progress:0,note:'Parallel reading — mental clarity as a leader'},
  ],
  courses:[
    {id:'c1',title:'HubSpot Content Marketing Certification',platform:'HubSpot Academy',cert:true,status:'queued',progress:0,note:'Free — Priority #1, start this week'},
    {id:'c2',title:'HubSpot Social Media Certification',platform:'HubSpot Academy',cert:true,status:'queued',progress:0,note:'Free — run in parallel'},
    {id:'c3',title:'LinkedIn Marketing Labs',platform:'LinkedIn',cert:true,status:'queued',progress:0,note:'Free — shows on your profile'},
    {id:'c4',title:'Google Ads Certification',platform:'Google Skillshop',cert:true,status:'queued',progress:0,note:'Free — direct from Google'},
    {id:'c5',title:'Brand Strategy',platform:'CXL Institute',cert:true,status:'queued',progress:0,note:'1-month subscription'},
    {id:'c6',title:'Digital Psychology & Persuasion',platform:'CXL Institute',cert:true,status:'queued',progress:0,note:'Same month as Brand Strategy'},
    {id:'c7',title:'Content Marketing',platform:'CXL Institute',cert:true,status:'queued',progress:0,note:'3 CXL courses in one month'},
    {id:'c8',title:'Brand Strategy Course',platform:'Brand Master Academy',cert:true,status:'queued',progress:0,note:'Single course — Month 6–12'},
    {id:'c9',title:'CIM Digital Marketing Certificate',platform:'CIM',cert:true,status:'queued',progress:0,note:'Most credible UK marketing credential'},
    {id:'c10',title:'Advanced Certificate in Brand Strategy',platform:'Kellogg Executive Education',cert:true,status:'queued',progress:0,note:'Year 2 — global credibility'},
  ],
  content:[
    {id:'ct1',title:"Seth Godin's Blog",cat:'Article',platform:'seths.blog',url:'https://seths.blog',note:'Daily'},
    {id:'ct2',title:'LinkedIn Feed',cat:'Article',platform:'LinkedIn',url:'https://linkedin.com',note:'Daily — engage with thought leaders'},
    {id:'ct3',title:'Motamem.org',cat:'Article',platform:'motamem.org',url:'https://motamem.org',note:'Weekly'},
    {id:'ct4',title:'Marketing Week',cat:'Article',platform:'marketingweek.com',url:'https://www.marketingweek.com',note:'Weekly'},
    {id:'ct5',title:'Campaign Magazine',cat:'Article',platform:'campaignlive.com',url:'https://www.campaignlive.com',note:'Weekly'},
    {id:'ct6',title:'WARC',cat:'Report',platform:'warc.com',url:'https://www.warc.com',note:'Weekly — case studies'},
    {id:'ct7',title:'Kantar BrandZ Reports',cat:'Report',platform:'Kantar',url:'https://www.kantar.com/campaigns/brandz',note:'Monthly'},
    {id:'ct8',title:'Dentsu Global Ad Spend',cat:'Report',platform:'Dentsu',url:'https://www.dentsu.com',note:'Monthly'},
    {id:'ct9',title:'Nielsen Marketing Report',cat:'Report',platform:'Nielsen',url:'https://www.nielsen.com/insights',note:'Monthly'},
    {id:'ct10',title:'Think with Google',cat:'Article',platform:'thinkwithgoogle.com',url:'https://www.thinkwithgoogle.com',note:'Monthly'},
  ],
  lang:[
    {id:'l1',title:'American English File',skill:'Speaking',level:'B2',url:'',status:'active',note:'Sun & Tue 10:30–12:00 | Thu 10:00–11:30'},
    {id:'l2',title:'iTalki — Native Speaker',skill:'Speaking',level:'C1',url:'https://www.italki.com',status:'queued',note:'45 min/week — Business English'},
    {id:'l3',title:'Marketing School Podcast',skill:'Listening',level:'B2',url:'https://marketingschool.io',status:'queued',note:'Daily 10 min'},
    {id:'l4',title:'How I Built This',skill:'Listening',level:'B2',url:'https://www.npr.org/series/how-i-built-this',status:'queued',note:'Weekly'},
    {id:'l5',title:'Grammarly',skill:'Writing',level:'C1',url:'https://www.grammarly.com',status:'queued',note:'Use for all English writing'},
    {id:'l6',title:'LinkedIn Posts in English',skill:'Writing',level:'B2',url:'',status:'queued',note:'1 per 4–5 Persian posts'},
  ],
  checks:{},lastDay:''
};

const KEY='mra_v5';
let D=JSON.parse(JSON.stringify(SD));
let cur='today',eId=null,eType=null;

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);D={...JSON.parse(JSON.stringify(SD)),...p};}}catch(e){}
  const td=new Date().toDateString();
  if(D.lastDay!==td){D.checks={};D.lastDay=td;svD();}
  const d=new Date();
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const mos=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('hdr-date').textContent=`${days[d.getDay()]}, ${mos[d.getMonth()]} ${d.getDate()}`;
  const h=d.getHours();
  const gr=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  document.getElementById('greeting').innerHTML=`${gr}, <em>MRA</em>`;
  render();
}

function svD(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function tst(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function getTasks(){
  const dy=new Date().getDay();// 0=Sun,2=Tue,4=Thu = class days
  const isCls=[0,2,4].includes(dy);
  const T=[];
  if(isCls)T.push({id:'lang-class',icon:'🌍',t:'Language Class',d:'American English File — online',dur:'60–90 min',cat:'learn'});
  T.push({id:'book-read',icon:'📖',t:'Book Reading',d:'This Is Marketing — current book',dur:isCls?'30 min':'60 min',cat:'learn'});
  T.push({id:'resources',icon:'📰',t:'Read Daily Resources',d:"Seth Godin's Blog + Motamem",dur:'30 min',cat:'read'});
  T.push({id:'li-post',icon:'✍️',t:'LinkedIn Content',d:'Write or plan your next post',dur:'30 min',cat:'brand'});
  T.push({id:'li-engage',icon:'💬',t:'LinkedIn Engagement',d:'Comment on 3–5 thought leader posts',dur:'20 min',cat:'brand'});
  if(![0,2,4].includes(dy)||true)T.push({id:'connections',icon:'🤝',t:'New Connections',d:'5–10 targeted: marketers, CMOs, agency leads',dur:'10 min',cat:'brand'});
  if(dy===1)T.push({id:'analytics',icon:'📊',t:'Weekly Analytics Review',d:'What performed? What drove engagement?',dur:'20 min',cat:'brand'});
  return T;
}

function updRing(){
  const tasks=getTasks();
  const tot=tasks.length,done=tasks.filter(t=>D.checks[t.id]).length;
  const pct=tot?Math.round(done/tot*100):0;
  const C=175.9,off=C-(C*pct/100);
  document.getElementById('rfill').style.strokeDashoffset=off;
  document.getElementById('rpct').textContent=pct+'%';
  document.getElementById('ptitle').textContent=pct===100?'All done! 🎉':"Today's Plan";
  document.getElementById('psub').innerHTML=pct===100?`You crushed it today, MRA!`:`<b>${done}/${tot}</b> tasks done`;
  document.getElementById('cel').classList.toggle('show',pct===100);
}

function rToday(){
  const tasks=getTasks();
  const cats=[['learn','📚 Learning'],['read','📰 Reading'],['brand','🎯 Personal Brand']];
  let html='';
  cats.forEach(([cat,lbl])=>{
    const ts=tasks.filter(t=>t.cat===cat);
    if(!ts.length)return;
    html+=`<div class="sec-lbl" style="${cat!=='learn'?'margin-top:1rem':''}">${lbl}</div>`;
    ts.forEach(t=>{
      const on=D.checks[t.id];
      html+=`<div class="task cat-${cat} ${on?'done':''}" onclick="tog('${t.id}')">
        <div class="chk ${on?'on'}" id="c-${t.id}"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.5l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="task-body">
          <div class="task-title">${t.icon} ${t.t}</div>
          <div class="task-meta"><span class="dur-tag">⏱ ${t.dur}</span>${t.d}</div>
        </div>
      </div>`;
    });
  });
  document.getElementById('today').innerHTML=html;
  updRing();
}

function tog(id){D.checks[id]=!D.checks[id];svD();rToday();}

function bStatus(s){const m={reading:'Reading',done:'Done ✓',queued:'Queued',progress:'In Progress',completed:'Done ✓',active:'Active'};return`<span class="badge b-${s}">${m[s]||s}</span>`;}

function rBooks(){
  let h=`<button class="add-btn" onclick="openM('books')">+ Add Book</button>`;
  (D.books||[]).forEach(x=>{
    const sp=x.status==='reading',p=x.status==='done'?100:x.progress||0;
    h+=`<div class="card"><div class="card-top"><div class="card-icon ci-book">📖</div><div class="card-body"><div class="card-title">${x.title}</div><div class="card-sub">${x.author} · ${x.lang}</div>${bStatus(x.status)}</div></div>
    ${(sp||x.status==='done')?`<div class="prog-bar-wrap"><div class="prog-bar-row"><span class="prog-bar-lbl">Progress</span><span class="prog-bar-pct">${p}%</span></div><div class="prog-bar"><div class="prog-bar-fill" style="width:${p}%"></div></div></div>`:''}
    ${x.note?`<div class="card-note">${x.note}</div>`:''}
    <div class="card-foot"><button class="mini" onclick="openM('books','${x.id}')">Edit</button><button class="mini del" onclick="delI('books','${x.id}')">Delete</button></div></div>`;
  });
  document.getElementById('books').innerHTML=h;
}

function rCourses(){
  let h=`<button class="add-btn" onclick="openM('courses')">+ Add Course</button>`;
  (D.courses||[]).forEach(x=>{
    const sp=x.status==='progress',p=x.progress||0;
    h+=`<div class="card"><div class="card-top"><div class="card-icon ci-course">🎓</div><div class="card-body"><div class="card-title">${x.title}</div><div class="card-sub">${x.platform}${x.cert?' · Certificate':''}</div>${bStatus(x.status==='completed'?'done':x.status)}</div></div>
    ${sp?`<div class="prog-bar-wrap"><div class="prog-bar-row"><span class="prog-bar-lbl">Progress</span><span class="prog-bar-pct">${p}%</span></div><div class="prog-bar"><div class="prog-bar-fill" style="width:${p}%"></div></div></div>`:''}
    ${x.note?`<div class="card-note">${x.note}</div>`:''}
    <div class="card-foot"><button class="mini" onclick="openM('courses','${x.id}')">Edit</button><button class="mini del" onclick="delI('courses','${x.id}')">Delete</button></div></div>`;
  });
  document.getElementById('courses').innerHTML=h;
}

function rResources(){
  const ico={Article:'📄',Report:'📊',Podcast:'🎙️',Video:'▶️'};
  let h=`<button class="add-btn" onclick="openM('content')">+ Add Resource</button>`;
  (D.content||[]).forEach(x=>{
    h+=`<div class="card"><div class="card-top"><div class="card-icon ci-res">${ico[x.cat]||'🔗'}</div><div class="card-body"><div class="card-title">${x.title}</div><div class="card-sub">${x.platform||''}</div>${x.note?`<div style="font-size:11px;color:var(--ink3);margin-top:2px">${x.note}</div>`:''}</div></div>
    <div class="card-foot">${x.url?`<button class="mini lnk" onclick="ol('${x.url}')">Open ↗</button>`:''}<button class="mini del" onclick="delI('content','${x.id}')">Delete</button></div></div>`;
  });
  document.getElementById('resources').innerHTML=h;
}

function rLang(){
  let h=`<button class="add-btn" onclick="openM('lang')">+ Add Resource</button>`;
  (D.lang||[]).forEach(x=>{
    h+=`<div class="card"><div class="card-top"><div class="card-icon ci-lang">🗣️</div><div class="card-body"><div class="card-title">${x.title}</div><div class="card-sub">${x.skill} · Level ${x.level}</div>${bStatus(x.status)}${x.note?`<div style="font-size:11px;color:var(--ink3);margin-top:4px">${x.note}</div>`:''}</div></div>
    <div class="card-foot">${x.url?`<button class="mini lnk" onclick="ol('${x.url}')">Open ↗</button>`:''}<button class="mini" onclick="openM('lang','${x.id}')">Edit</button><button class="mini del" onclick="delI('lang','${x.id}')">Delete</button></div></div>`;
  });
  document.getElementById('lang').innerHTML=h;
}

function rSettings(){
  const tot=(D.books||[]).length+(D.courses||[]).length+(D.content||[]).length+(D.lang||[]).length;
  const done=(D.books||[]).filter(x=>x.status==='done').length+(D.courses||[]).filter(x=>x.status==='completed').length;
  document.getElementById('settings').innerHTML=`
    <div class="set-block"><div class="set-sec">Overview</div><div class="stats-g">
      <div class="smin"><span class="smin-l">Total Items</span><span class="smin-v">${tot}</span></div>
      <div class="smin"><span class="smin-l">Completed</span><span class="smin-v">${done}</span></div>
      <div class="smin"><span class="smin-l">Books</span><span class="smin-v">${(D.books||[]).length}</span></div>
      <div class="smin"><span class="smin-l">Courses</span><span class="smin-v">${(D.courses||[]).length}</span></div>
    </div></div>
    <div class="set-block"><div class="set-sec">Export</div>
      <div class="set-row"><div><div class="set-lbl">Download JSON</div><div class="set-desc">Backup all data</div></div><button class="set-btn p" onclick="expJ()">Download</button></div>
      <div class="set-row"><div><div class="set-lbl">Copy JSON</div><div class="set-desc">Clipboard backup</div></div><button class="set-btn" onclick="cpJ()">Copy</button></div>
    </div>
    <div class="set-block"><div class="set-sec">Import</div>
      <div class="set-row"><div><div class="set-lbl">Load from JSON</div><div class="set-desc">Restore backup</div></div><button class="set-btn" onclick="document.getElementById('fi').click()">Choose File</button></div>
    </div>
    <div class="set-block"><div class="set-sec">Danger Zone</div>
      <div class="set-row"><div><div class="set-lbl">Reset Data</div><div class="set-desc">Restore original seed</div></div><button class="set-btn d" onclick="rst()">Reset</button></div>
    </div>`;
}

function expJ(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mra-${new Date().toISOString().slice(0,10)}.json`;a.click();tst('Downloaded ✓');}
function cpJ(){navigator.clipboard.writeText(JSON.stringify(D,null,2)).then(()=>tst('Copied ✓')).catch(()=>tst('Failed'));}
function importD(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(typeof p==='object'){if(confirm('Replace current data?')){D={...JSON.parse(JSON.stringify(SD)),...p};svD();render();tst('Imported ✓');}}}catch{tst('Error');}e.target.value='';};r.readAsText(f);}
function rst(){if(confirm('Reset?')){D=JSON.parse(JSON.stringify(SD));D.lastDay=new Date().toDateString();svD();render();tst('Reset ✓');}}

function openM(type,id){
  eId=id||null;eType=type;
  const map={books:D.books,courses:D.courses,content:D.content,lang:D.lang};
  const x=id?map[type]?.find(i=>i.id===id):null;
  const tls={books:'Book',courses:'Course',content:'Resource',lang:'Language Resource'};
  document.getElementById('mtitle').textContent=(id?'Edit ':'Add ')+tls[type];
  let f='';
  if(type==='books')f=`<div class="field"><label>Title</label><input id="f0" value="${x?.title||''}" placeholder="Book title"></div><div class="field-row"><div class="field"><label>Author</label><input id="f1" value="${x?.author||''}" placeholder="Author"></div><div class="field"><label>Language</label><select id="f2"><option value="Persian" ${!x?.lang||x?.lang==='Persian'?'selected':''}>Persian</option><option value="English" ${x?.lang==='English'?'selected':''}>English</option></select></div></div><div class="field"><label>Status</label><select id="f3"><option value="queued" ${!x?.status||x?.status==='queued'?'selected':''}>Queued</option><option value="reading" ${x?.status==='reading'?'selected':''}>Reading</option><option value="done" ${x?.status==='done'?'selected':''}>Done</option></select></div><div class="field"><label>Progress</label><div class="rw"><input type="range" id="f4" min="0" max="100" step="5" value="${x?.progress||0}" oninput="document.getElementById('rv').textContent=this.value+'%'"><span class="rv" id="rv">${x?.progress||0}%</span></div></div><div class="field"><label>Notes</label><textarea id="f5" placeholder="What did you learn?">${x?.note||''}</textarea></div>`;
  else if(type==='courses')f=`<div class="field"><label>Title</label><input id="f0" value="${x?.title||''}" placeholder="Course name"></div><div class="field-row"><div class="field"><label>Platform</label><input id="f1" value="${x?.platform||''}" placeholder="HubSpot, CXL..."></div><div class="field"><label>Certificate</label><select id="f2"><option value="">No</option><option value="yes" ${x?.cert?'selected':''}>Yes</option></select></div></div><div class="field"><label>Status</label><select id="f3"><option value="queued" ${!x?.status||x?.status==='queued'?'selected':''}>Queued</option><option value="progress" ${x?.status==='progress'?'selected':''}>In Progress</option><option value="completed" ${x?.status==='completed'?'selected':''}>Completed</option></select></div><div class="field"><label>Progress</label><div class="rw"><input type="range" id="f4" min="0" max="100" step="5" value="${x?.progress||0}" oninput="document.getElementById('rv').textContent=this.value+'%'"><span class="rv" id="rv">${x?.progress||0}%</span></div></div><div class="field"><label>Notes</label><textarea id="f5" placeholder="Notes...">${x?.note||''}</textarea></div>`;
  else if(type==='content')f=`<div class="field"><label>Title</label><input id="f0" value="${x?.title||''}" placeholder="Resource title"></div><div class="field-row"><div class="field"><label>Category</label><select id="f1"><option value="Article">Article</option><option value="Report">Report</option><option value="Podcast">Podcast</option><option value="Video">Video</option></select></div><div class="field"><label>Platform</label><input id="f2" value="${x?.platform||''}" placeholder="Platform"></div></div><div class="field"><label>URL</label><input id="f3" value="${x?.url||''}" placeholder="https://..."></div><div class="field"><label>Notes</label><textarea id="f5" placeholder="Why important?">${x?.note||''}</textarea></div>`;
  else if(type==='lang')f=`<div class="field"><label>Title</label><input id="f0" value="${x?.title||''}" placeholder="Resource name"></div><div class="field-row"><div class="field"><label>Skill</label><select id="f1"><option value="Speaking" ${x?.skill==='Speaking'?'selected':''}>Speaking</option><option value="Listening" ${x?.skill==='Listening'?'selected':''}>Listening</option><option value="Writing" ${x?.skill==='Writing'?'selected':''}>Writing</option><option value="Vocabulary">Vocabulary</option></select></div><div class="field"><label>Level</label><select id="f2"><option value="B2" ${!x?.level||x?.level==='B2'?'selected':''}>B2</option><option value="C1" ${x?.level==='C1'?'selected':''}>C1</option></select></div></div><div class="field"><label>URL</label><input id="f3" value="${x?.url||''}" placeholder="https://..."></div><div class="field"><label>Status</label><select id="f4"><option value="queued" ${!x?.status||x?.status==='queued'?'selected':''}>Queued</option><option value="active" ${x?.status==='active'?'selected':''}>Active</option><option value="done" ${x?.status==='done'?'selected':''}>Done</option></select></div><div class="field"><label>Notes</label><textarea id="f5" placeholder="Tips?">${x?.note||''}</textarea></div>`;
  document.getElementById('mfields').innerHTML=f;
  document.getElementById('ov').classList.add('open');
}

function closeM(){document.getElementById('ov').classList.remove('open');eId=null;eType=null;}

function saveM(){
  const t=eType;const title=document.getElementById('f0')?.value?.trim();if(!title)return;
  const b={id:eId||uid(),title};const g=n=>document.getElementById(n)?.value||'';
  if(t==='books')Object.assign(b,{author:g('f1'),lang:g('f2')||'Persian',status:g('f3')||'queued',progress:parseInt(g('f4'))||0,note:g('f5')});
  else if(t==='courses')Object.assign(b,{platform:g('f1'),cert:g('f2')==='yes',status:g('f3')||'queued',progress:parseInt(g('f4'))||0,note:g('f5')});
  else if(t==='content')Object.assign(b,{cat:g('f1')||'Article',platform:g('f2'),url:g('f3'),note:g('f5')});
  else if(t==='lang')Object.assign(b,{skill:g('f1')||'Listening',level:g('f2')||'B2',url:g('f3'),status:g('f4')||'queued',note:g('f5')});
  if(!D[t])D[t]=[];
  if(eId){const i=D[t].findIndex(x=>x.id===eId);if(i!==-1)D[t][i]=b;}else D[t].push(b);
  svD();closeM();render();tst('Saved ✓');
}

function delI(t,id){if(!confirm('Delete?'))return;D[t]=D[t].filter(x=>x.id!==id);svD();render();tst('Deleted');}
function ol(u){if(u)window.open(u,'_blank');}
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeM();});

function sw(tab){
  cur=tab;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['today','books','courses','resources','lang','settings'][i]===tab));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  render();
}

function render(){
  if(cur==='today')rToday();
  else if(cur==='books')rBooks();
  else if(cur==='courses')rCourses();
  else if(cur==='resources')rResources();
  else if(cur==='lang')rLang();
  else if(cur==='settings')rSettings();
}

load();
</script>
</body>
</html>
